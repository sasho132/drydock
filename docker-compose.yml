name: drydock

services:
  drydock:
    # Empty = build locally with `docker compose up -d --build`.
    # With no image name, `docker compose pull` skips this service instead of
    # trying to fetch a local tag from Docker Hub.
    # Set DRYDOCK_IMAGE to a published image to pull instead.
    image: ${DRYDOCK_IMAGE:-}
    build:
      context: .
      args:
        VERSION: ${DRYDOCK_VERSION:-dev}
        COMMIT: ${DRYDOCK_COMMIT:-unknown}

    container_name: drydock
    restart: unless-stopped

    labels:
      # Never try to update the updater. Drydock also detects its own container
      # automatically, but the label is explicit and survives custom hostnames.
      drydock.enable: "false"

    # The image runs as the nonroot user, so it needs the group that owns the
    # Docker socket. Set DOCKER_GID in .env (see .env.example).
    user: "65532:65532"
    group_add:
      - "${DOCKER_GID:-0}"

    environment:
      DRYDOCK_STATE_FILE: /var/lib/drydock/state.json
      DRYDOCK_INTERVAL: ${DRYDOCK_INTERVAL:-6h}
      DRYDOCK_ROLLBACK: ${DRYDOCK_ROLLBACK:-true}
      DRYDOCK_CLEANUP: ${DRYDOCK_CLEANUP:-false}
      DRYDOCK_CONCURRENCY: ${DRYDOCK_CONCURRENCY:-2}
      DRYDOCK_LOG_LEVEL: ${DRYDOCK_LOG_LEVEL:-info}

      # Dashboard + JSON API. Loopback-only by default; see the ports section.
      DRYDOCK_API_ENABLED: ${DRYDOCK_API_ENABLED:-true}
      DRYDOCK_UI_USERNAME: ${DRYDOCK_UI_USERNAME:-admin}
      # Empty password = read-only dashboard. Set it to enable update/rollback.
      DRYDOCK_UI_PASSWORD: ${DRYDOCK_UI_PASSWORD:-}
      # DRYDOCK_API_TOKEN: ${DRYDOCK_API_TOKEN:-}
      # DOCKER_CONFIG: /config   # with the docker config volume below

    ports:
      # 127.0.0.1 keeps the dashboard off the network. For LAN access set
      # DRYDOCK_BIND=0.0.0.0 (use a TLS reverse proxy if it faces the internet),
      # or reach it through an SSH tunnel:
      #   ssh -L 8080:127.0.0.1:8080 user@server
      - "${DRYDOCK_BIND:-127.0.0.1}:${DRYDOCK_PORT:-8080}:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - drydock-data:/var/lib/drydock
      # Optional: use a config file instead of environment variables.
      # - ./drydock.yaml:/etc/drydock/config.yaml:ro
      # Optional: reuse Docker's credentials for private registries (only if
      # config.json stores credentials directly, not via a credsStore helper).
      # - ${HOME}/.docker/config.json:/config/config.json:ro

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  drydock-data:
    name: drydock-data
